# ============================================================
# pup-clean source inspection defaults
# ============================================================

# WHY: Define Python operations and file types used to identify artifacts
# generated by project source code.
#
# REQ: pup-clean inspects the project's Python source to determine what
# that specific project generates.
#
# SAFETY: Only statically resolved generated paths are eligible for cleanup.
# Ambiguous or dynamically unresolved paths are not deleted.


# ------------------------------------------------------------
# Data-writing methods
# ------------------------------------------------------------

data_write_methods = [
    "to_csv",
    "to_excel",
    "to_feather",
    "to_json",
    "to_orc",
    "to_parquet",
    "to_pickle",
    "to_stata",
]


# ------------------------------------------------------------
# Image-writing methods
# ------------------------------------------------------------

# Methods whose path argument identifies a generated image artifact.
#
# OBS: These identify the generated FILE only. Parent directories such as
# docs/images are not cleanup targets.

image_write_methods = [
    "savefig",
    "write_image",
]


# ------------------------------------------------------------
# Database creation / connection functions
